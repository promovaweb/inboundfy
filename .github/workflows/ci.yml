name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Validar Node.js e pacote npm
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar ferramentas de verificação do ebook
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig imagemagick jq libxml2-utils pandoc pipx poppler-utils unzip
          pipx install weasyprint==69.0
          mkdir -p "$RUNNER_TEMP/inboundfy-bin"
          printf '#!/bin/sh\nexec convert "$@"\n' > "$RUNNER_TEMP/inboundfy-bin/magick"
          chmod +x "$RUNNER_TEMP/inboundfy-bin/magick"
          echo "$RUNNER_TEMP/inboundfy-bin" >> "$GITHUB_PATH"

      - name: Instalar dependências
        run: npm ci

      - name: Validar framework e CLI
        run: npm run validar

      - name: Empacotar distribuição npm
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Validar instalação isolada
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run npm:validate-package -- "artifacts/promovaweb-inboundfy-${version}.tgz"

      - name: Guardar pacote validado
        uses: actions/upload-artifact@v7
        with:
          name: pacote-npm
          path: artifacts/*.tgz
          if-no-files-found: error
