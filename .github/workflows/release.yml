name: Release

# Cria a GitHub Release de uma tag vX.Y.Z com os binários de cada
# plataforma, o ebook (PDF e EPUB) e o SHA256SUMS. O pacote npm
# @promovaweb/inboundfy é um invólucro que baixa o binário desta release; a
# publicação no npm é feita pela máquina local (veja RELEASING.md).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-inboundfy
  cancel-in-progress: false

jobs:
  binarios:
    name: Compilar binários e publicar a release
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Pacotes nativos de todas as plataformas na versão do lockfile.
      - name: Instalar pacotes nativos do OpenTUI para todos os alvos
        run: bun install --frozen-lockfile --os="*" --cpu="*" --libc="*"

      - name: Conferir versão da tag
        run: |
          versao="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$versao"
          test "$(jq -r .version npm/package.json)" = "$versao"
          test "$(cat ebook/VERSION)" = "$versao"

      - name: Validar projeto
        run: bun run validate

      # O validate deixa dist/inboundfy da máquina do runner; a release leva só os alvos nomeados.
      - name: Limpar dist
        run: rm -rf dist

      - name: Compilar para todas as plataformas
        run: bun run build:all

      - name: Anexar ebook
        run: |
          versao="${GITHUB_REF_NAME#v}"
          cp "ebook/Inboundfy-Guia-do-Usuario-v${versao}.pdf" dist/
          cp "ebook/Inboundfy-Guia-do-Usuario-v${versao}.epub" dist/

      - name: Gerar checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Extrair notas do changelog
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { imprimir = 1; next }
            /^## \[/ { if (imprimir) exit }
            imprimir { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || echo "Release ${GITHUB_REF_NAME}." > notas.md

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas.md
          files: |
            dist/*
